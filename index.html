<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            min-height: 100vh;
        }

        /* Static Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            background-image: url('back.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Dark overlay for readability */
        .background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .image-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 3/4;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-card:hover img {
            transform: scale(1.1);
        }

        /* Settings Panel */
        .settings-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .settings-panel input {
            width: 90%;
            padding: 10px 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
            .settings-panel { bottom: 10px; right: 10px; padding: 0.8rem 1rem; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .gallery { grid-template-columns: 1fr; gap: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Static Background -->
    <div class="background" id="background"></div>

  <!-- Main Content -->
    <div class="container">
        <h1>My Image Gallery</h1>
        
        <div class="gallery" id="gallery-grid">
            <!-- Images will be loaded here -->
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel">
        <strong>Change Background:</strong><br>
        <input type="text" id="bg-input" placeholder=">
