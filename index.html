<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ship Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-image: url('back.webp');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        .gallery {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #ship-image {
            max-width: 80vw;
            max-height: 70vh;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }

        .nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: rgba(0,0,0,0.9);
        }

        #filename {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div class="gallery">
    <img id="ship-image" src="" alt="Ship">
</div>

<div id="filename"></div>

<div class="nav">
    <button onclick="prevShip()">← Previous</button>
    <button onclick="nextShip()">Next →</button>
</div>

<script>
    const ships = [
        'COR-Caracara.png',
        'DIS-Borer.png',
        'DIS-Bute.png',
        'DIS-Femur.png',
        'DIS-Notch.png',
        'DIS-Olympus.png',
        'DIS-Pluto.png',
        'DIS-Rig.png',
        'DIS-Vaquita.png',
        'DME-Shareholder.png',
        'HES-Arribane.png',
        'HES-Canister.png',
        'HES-Phaeron.png',
        'HES-Windreign.png',
        'IHR-Victoria.png',
        'JinZeros.png',
        'Mcchicken.png',
        'Mcchilly.png',
        'Mi-CorKunai.png',
        'Mi-CorTanuki.png',
        'NS-Ethereal.png',
        'NSK-Tiger.png',
        'PB-Bratan.png',
        'PB-Piva.png',
        'PDW-Valkyrie.png',
        'PTI-Spessbite.png',
        'SE-Jitterbug.png',
        'SKR-Archer.png',
        'SKR-Argent.png',
        'SKR-Autumn.png',
        'SKR-Hammerhead.png',
        'SKR-Kestrel.png',
        'SKR-Lapetus.png',
        'SKR-M-class.png',
        'SKR-Noble.png',
        'SKR-Peregrine.png',
        'SKR-Praetorian.png',
        'SKR-Sakuratsu.png',
        'SKR-Twilight.png',
        'TPC-Pillbox.png',
        'UI-Spyglass.png',
        'UNJ-Framework.png',
        'UW-Sellsword.png',
        'UW-Takeaway.png',
        'ZOB-Claymore.png',
        'CDM-Comet.png',
        'COG-Arkansaw.png',
        'HT-Sagitarius.png',
        'MI-Siebel.png',
        'PB-Padval.png',
        'SHM-Judiciary.png',
        'SHM-Magus.png',
        'SKR-Littora.png',
        'SKR-Pisces.png',
        'SKR-Sirius.png',
        'SRA-Duran.png',
        'UNSA-Fortunate.png',
        'ZOB-Sabine.png',
        'Zob-Twilight.png'
    ];

    let currentIndex = 0;

    function loadShip(index) {
        const img = document.getElementById('ship-image');
        const filename = document.getElementById('filename');
        
        // Fade out
        img.style.opacity = '0';
        
        setTimeout(() => {
            img.src = ships[index];
            filename.textContent = ships[index];
            
            // Fade in after loading starts
            img.onload = () => {
                img.style.opacity = '1';
            };
        }, 200);
    }

    function nextShip() {
        currentIndex = (currentIndex + 1) % ships.length;
        loadShip(currentIndex);
    }

    function prevShip() {
        currentIndex = (currentIndex - 1 + ships.length) % ships.length;
        loadShip(currentIndex);
    }

    // Load first ship on page load
    window.onload = () => {
        loadShip(0);
    };
</script>

</body>
</html>
